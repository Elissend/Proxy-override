name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的旧运行自动取消,避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS 语法检查
        run: node --check proxy-override.js

      - name: 语义断言(规则数/引用完整性/正则逗号安全等)
        run: node scripts/validate.js

      - name: YAML 生成区新鲜度(dns/规则集/规则三区块须与 JS 一致)
        run: node scripts/generate-yaml.js --check

      - name: 导出 JS 生成配置
        run: node scripts/validate.js --dump > /tmp/js-dump.json

      - name: 安装 PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: YAML 校验与 JS↔YAML 一致性
        run: python scripts/validate.py /tmp/js-dump.json

      - name: 规则集 URL 可达性(并行,带重试)
        run: |
          node scripts/validate.js --urls > /tmp/urls.txt
          check() {
            for i in 1 2 3; do
              curl -sfIL --max-time 20 "$1" -o /dev/null && return 0
              sleep 3
            done
            echo "不可达: $1"; return 1
          }
          export -f check
          xargs -a /tmp/urls.txt -P 8 -I{} bash -c 'check "$@"' _ {}

      - name: mihomo 真实内核配置测试
        run: |
          # 带 token 调 API,规避共享 runner 的未认证限额
          tag=$(curl -sfL -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
          echo "内核版本: $tag"
          curl -sfL "https://github.com/MetaCubeX/mihomo/releases/download/${tag}/mihomo-linux-amd64-${tag}.gz" -o mihomo.gz
          gunzip mihomo.gz && chmod +x mihomo
          sed 's|https://你的机场订阅链接|http://127.0.0.1:9/dummy.yaml|' proxy-override.yaml > /tmp/test.yaml
          out=$(./mihomo -t -f /tmp/test.yaml -d /tmp 2>&1); code=$?
          echo "$out"
          # 除了退出码,还要求零 error 级日志(曾借此发现 global-client-fingerprint 被移除)
          if [ $code -ne 0 ] || echo "$out" | grep -q "level=error"; then exit 1; fi
