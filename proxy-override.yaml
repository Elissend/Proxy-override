# FlClash / Mihomo 通用覆写配置（独立 YAML 版本）
# 版本：v2.0 (2026-05-18)
# 架构：3 基础设施组 + 9 业务策略组 + 9 rule-providers + 全加密 DNS
# 适用：Mihomo / Clash.Meta 内核；任何机场订阅
# 对应 JS 覆写脚本：proxy-override.js
#
# === 导入方法 ===
#
# 将本文件作为 Mihomo 配置文件加载（或与现有配置合并）。
# 必须将 proxy-providers.sub.url 替换为你的机场订阅链接。
#
# ================================================================

# ================================================================
#  全局参数
# ================================================================

unified-delay: true
tcp-concurrent: true
find-process-mode: strict
keep-alive-idle: 30
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: false

geox-url:
  geosite: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  geoip: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geoip-mmdb: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb

# ================================================================
#  端口 / SOCKS / 混合入站
# ================================================================

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

# ================================================================
#  Sniffer 嗅探
# ================================================================

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.netlify.app
    - +.vercel.app
    - +.workers.dev
  skip-domain:
    - Mijia Cloud
    - +.oray.com
    - +.oray.net
    - +.apple.com

# ================================================================
#  DNS 全加密
# ================================================================

dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.lan
    - +.local
    - +.localhost
    - +.direct
    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.baidu.com
    - +.bilibili.com
    - +.bing.com
    - +.chiphell.com
    - +.oray.com
    - +.sunlogin.com
    - +.todesk.com
    - +.rustdesk.com
    - +.teamviewer.com
    - +.anydesk.com
    - +.tailscale.com
    - +.zerotier.com
    - +.nvidia.com
    - +.ntp.org
    - +.pool.ntp.org
    - time.*.com
    - ntp.*.com
    - time.*.gov
    - time.*.apple.com
    - time.windows.com
    - time.nist.gov
    - +.stun.*
    - +.stun.*.*
    - +.stun.*.*.*
    - stun.*
    - ip.cip.cc
    - captive.apple.com
    - connectivitycheck.gstatic.com
    - id6.me
    - localhost.ptlogin2.qq.com
    - +.cmpassport.com
    - +.mcdn.bilivideo.cn
    - +.battlenet.com.cn
    - +.wotgame.cn
    - +.wggames.cn
    - +.wowsgame.cn
  default-nameserver:
    - tls://223.5.5.5
    - tls://223.6.6.6
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - tls://223.5.5.5
  direct-nameserver:
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    geosite:cn,geolocation-cn,bilibili,biliintl:
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
      - tls://223.5.5.5
      - tls://223.6.6.6
    aistudio.google.com:
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query
  nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  respect-rules: true
  direct-nameserver-follow-policy: true

# ================================================================
#  代理订阅（proxy-provider）
# ================================================================
#  替换 sub.url 为你的机场订阅链接
#  如机场订阅本身就是 Clash 兼容格式，type 保持 http
#  如机场提供 SS/SSR/Vmess 链接，需后端转换后使用
#
#  节点名过滤说明：
#  Mihomo 的 RE2 正则引擎不支持负向零宽断言 (?!...)，
#  无法像 JS 覆写脚本那样在 YAML 中排除"剩余/到期/官网/免费"等
#  信息节点。如果订阅含大量信息节点，建议：
#    1) 使用 proxy-override.js 覆写脚本版本（支持 isInfoNode 过滤）
#    2) 或在机场侧清理无效节点
#    3) 或手动编辑 proxy-providers/sub.yaml 缓存文件删除信息节点行

proxy-providers:
  sub:
    type: http
    url: "https://你的机场订阅链接"
    path: ./proxy-providers/sub.yaml
    interval: 3600
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

# ================================================================
#  连接代理（手动添加的独立节点，可选）
# ================================================================

proxies: []
  # - name: "手动节点示例"
  #   type: ss
  #   server: example.com
  #   port: 443
  #   cipher: aes-256-gcm
  #   password: "your-password"

# ================================================================
#  策略组
# ================================================================

proxy-groups:
  # --- 基础设施组（3 个）---

  - name: 🎯 节点选择
    type: select
    use:
      - sub
    proxies:
      - ⚡ 自动选择
      - 🔄 故障转移
      - DIRECT

  - name: ⚡ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 150
    lazy: true
    use:
      - sub
    # filter 可选：限制参与测速的节点名正则（RE2 语法）
    # filter: ".*"

  - name: 🔄 故障转移
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 300
    lazy: true
    use:
      - sub

  # --- 业务策略组（9 个）---

  - name: 🤖 AI 服务
    type: select
    use:
      - sub
    proxies:
      - 🎯 节点选择
      - ⚡ 自动选择
      - 🔄 故障转移
      - DIRECT

  - name: 📹 YouTube
    type: select
    use:
      - sub
    proxies:
      - 🎯 节点选择
      - ⚡ 自动选择
      - 🔄 故障转移
      - DIRECT

  - name: ✈️ Telegram
    type: select
    use:
      - sub
    proxies:
      - 🎯 节点选择
      - ⚡ 自动选择
      - 🔄 故障转移
      - DIRECT

  - name: 🎬 流媒体
    type: select
    use:
      - sub
    proxies:
      - 🎯 节点选择
      - ⚡ 自动选择
      - 🔄 故障转移
      - DIRECT

  - name: 🍎 苹果服务
    type: select
    use:
      - sub
    proxies:
      - DIRECT
      - 🎯 节点选择
      - ⚡ 自动选择
      - 🔄 故障转移

  - name: Ⓜ️ 微软服务
    type: select
    use:
      - sub
    proxies:
      - DIRECT
      - 🎯 节点选择
      - ⚡ 自动选择
      - 🔄 故障转移

  - name: 🏠 国内直连
    type: select
    proxies:
      - DIRECT

  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🐟 漏网之鱼
    type: select
    use:
      - sub
    proxies:
      - 🎯 节点选择
      - ⚡ 自动选择
      - 🔄 故障转移
      - DIRECT
      - REJECT

# ================================================================
#  远程规则集（9 个 MRS）
# ================================================================

rule-providers:
  anti-ad:
    type: http
    behavior: domain
    format: mrs
    url: https://fastly.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/ads.mrs
    path: ./ruleset/anti-ad.mrs
    interval: 85515
    proxy: DIRECT

  openai:
    type: http
    behavior: domain
    format: mrs
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/openai.mrs
    path: ./ruleset/meta-openai.mrs
    interval: 85530
    proxy: 🤖 AI 服务

  tiktok:
    type: http
    behavior: domain
    format: mrs
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/tiktok.mrs
    path: ./ruleset/meta-tiktok.mrs
    interval: 85575
    proxy: 🎬 流媒体

  github:
    type: http
    behavior: domain
    format: mrs
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/github.mrs
    path: ./ruleset/meta-github.mrs
    interval: 85635
    proxy: DIRECT

  microsoft:
    type: http
    behavior: domain
    format: mrs
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/microsoft.mrs
    path: ./ruleset/meta-microsoft.mrs
    interval: 85650
    proxy: Ⓜ️ 微软服务

  apple:
    type: http
    behavior: domain
    format: mrs
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/apple.mrs
    path: ./ruleset/meta-apple.mrs
    interval: 85665
    proxy: 🍎 苹果服务

  proxy_sites:
    type: http
    behavior: domain
    format: mrs
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/geolocation-!cn.mrs
    path: ./ruleset/proxy_sites.mrs
    interval: 86415
    proxy: DIRECT

  cn_sites:
    type: http
    behavior: domain
    format: mrs
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs
    path: ./ruleset/cn_sites.mrs
    interval: 86430
    proxy: DIRECT

  gfw:
    type: http
    behavior: domain
    format: mrs
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/gfw.mrs
    path: ./ruleset/meta-gfw.mrs
    interval: 86445
    proxy: DIRECT

# ================================================================
#  分流规则（216 条）
# ================================================================

rules:
  # --- 广告拦截 ---
  - GEOSITE,category-ads-all,🛑 广告拦截
  - RULE-SET,anti-ad,🛑 广告拦截

  # --- QUIC 阻断（微软/苹果豁免，其余非中国站点 REJECT）---
  - AND,((DST-PORT,443),(NETWORK,UDP),(RULE-SET,microsoft)),Ⓜ️ 微软服务
  - AND,((DST-PORT,443),(NETWORK,UDP),(RULE-SET,apple)),🍎 苹果服务
  - AND,((DST-PORT,443),(NETWORK,UDP),(NOT,((RULE-SET,cn_sites)))),REJECT

  # --- 局域网 / 私有网络 ---
  - DST-PORT,7680,REJECT
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - DOMAIN,localhost,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT

  # --- 进程名直连（仅 Windows 平台 TUN 模式生效）---
