# ---- 远程规则集（9 个 MRS） ----
#  所有 URL 使用 fastly.jsdelivr.net CDN 分发
#  下载统一走 DIRECT：指向策略组时，首次启动或组内选中节点故障会导致
#  规则集静默更新失败；fastly.jsdelivr.net 国内可直连
#  中国大陆用户遇到下载失败可替换以下任一镜像:
#    fastly.jsdelivr.net    → testingcf.jsdelivr.net (Cloudflare CDN)
#    fastly.jsdelivr.net    → gcore.jsdelivr.net     (Gcore CDN)

rule-providers:
  anti-ad:
    type: http
    behavior: domain
    format: mrs
    url: https://fastly.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/ads.mrs
    path: ./ruleset/anti-ad.mrs
    interval: 85515
    proxy: DIRECT

  # 公共 BT tracker（BT 流量必须直连：机场普遍禁 P2P，走代理有封号风险）
  bt-tracker:
    type: http
    behavior: domain
    format: mrs
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-public-tracker.mrs
    path: ./ruleset/bt-tracker.mrs
    interval: 86475
    proxy: DIRECT

  # 国内 HTTPDNS 服务端点（拦截后 App 回落系统 DNS，防止绕过域名分流）
  httpdns:
    type: http
    behavior: domain
    format: mrs
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-httpdns-cn.mrs
    path: ./ruleset/httpdns.mrs
    interval: 86490
    proxy: DIRECT

  # category-ai-!cn 含 OpenAI/Claude/Gemini/Copilot/Perplexity/Mistral 等主流 AI 服务
  ai:
    type: http
    behavior: domain
    format: mrs
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ai-!cn.mrs
    path: ./ruleset/meta-ai.mrs
    interval: 85530
    proxy: DIRECT

  tiktok:
    type: http
    behavior: domain
    format: mrs
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/tiktok.mrs
    path: ./ruleset/meta-tiktok.mrs
    interval: 85575
    proxy: DIRECT

  github:
    type: http
    behavior: domain
    format: mrs
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/github.mrs
    path: ./ruleset/meta-github.mrs
    interval: 85635
    proxy: DIRECT

  microsoft:
    type: http
    behavior: domain
    format: mrs
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/microsoft.mrs
    path: ./ruleset/meta-microsoft.mrs
    interval: 85650
    proxy: DIRECT

  apple:
    type: http
    behavior: domain
    format: mrs
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/apple.mrs
    path: ./ruleset/meta-apple.mrs
    interval: 85665
    proxy: DIRECT

  proxy_sites:
    type: http
    behavior: domain
    format: mrs
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/geolocation-!cn.mrs
    path: ./ruleset/proxy_sites.mrs
    interval: 86415
    proxy: DIRECT

  cn_sites:
    type: http
    behavior: domain
    format: mrs
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs
    path: ./ruleset/cn_sites.mrs
    interval: 86430
    proxy: DIRECT

  gfw:
    type: http
    behavior: domain
    format: mrs
    url: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/gfw.mrs
    path: ./ruleset/meta-gfw.mrs
    interval: 86445
    proxy: DIRECT

# ---- 分流规则 ----

rules:
  # --- BT / P2P 直连（放最前：机场普遍禁 BT，走代理有封号风险，
  #     且 tracker 拿到代理 IP 会拖慢下载）---
  - PROCESS-NAME,qbittorrent.exe,DIRECT
  - PROCESS-NAME,BitComet.exe,DIRECT
  - PROCESS-NAME,uTorrent.exe,DIRECT
  - PROCESS-NAME,transmission-qt.exe,DIRECT
  - PROCESS-NAME,aria2c.exe,DIRECT
  - PROCESS-NAME,Thunder.exe,DIRECT
  - RULE-SET,bt-tracker,DIRECT

  # --- 个人自定义直连（使用者请按需修改或删除本段）---
  # 前置放行：优先级高于广告拦截和所有业务分流，
  # 适合放行你自己常用的小程序、公司内网、学校系统、游戏端口等
  - DOMAIN-SUFFIX,school-wx.qshnhealth.com,DIRECT
  - DOMAIN-SUFFIX,xindazhilian.com,DIRECT
  - DOMAIN-SUFFIX,chiphell.com,DIRECT
  - DOMAIN-SUFFIX,halo.run,DIRECT
  - DST-PORT,33068,DIRECT
  - DST-PORT,6540,DIRECT
  - DST-PORT,26880,DIRECT

  # --- 微信小程序基础设施（anti-ad 规则集可能误伤 *.wxs.qq.com，优先放行）---
  - DOMAIN-SUFFIX,wxs.qq.com,DIRECT
  - DOMAIN-SUFFIX,wx.qlogo.cn,DIRECT
  - DOMAIN-SUFFIX,servicewechat.com,DIRECT
  - DOMAIN-SUFFIX,mp.weixin.qq.com,DIRECT

  # --- 火山引擎 APM / 极光推送（anti-ad 规则集误伤，米哈游等国服游戏基础设施）---
  - DOMAIN,apmplus.volces.com,DIRECT
  - DOMAIN-SUFFIX,jpush.io,DIRECT
  - DOMAIN-SUFFIX,jpush.cn,DIRECT
  - DOMAIN,easytomessage.com,DIRECT
  # 友盟推送/错误日志（国内大量 App 依赖）
  - DOMAIN,msg.umeng.com,DIRECT
  - DOMAIN,msg.umengcloud.com,DIRECT
  - DOMAIN,errlog.umeng.com,DIRECT
  # 归因 SDK（Adjust/AppsFlyer，国内 App 广泛集成，被广告规则误伤）
  - DOMAIN,app.adjust.com,DIRECT
  - DOMAIN,app.appsflyer.com,DIRECT
  # 公共 CDN
  - DOMAIN-SUFFIX,baomitu.com,DIRECT
  - DOMAIN-SUFFIX,bootcss.com,DIRECT
  - DOMAIN-SUFFIX,staticfile.org,DIRECT
  - DOMAIN-SUFFIX,upaiyun.com,DIRECT
  # Android 系统服务（被墙，走代理；广告规则可能误伤需前置放行）
  - DOMAIN-SUFFIX,mtalk.google.com,Google
  - DOMAIN,clientservices.googleapis.com,Google
  - DOMAIN,update.googleapis.com,Google
  - DOMAIN-SUFFIX,dl.google.com,Google
  - DOMAIN-SUFFIX,dl.l.google.com,Google

  # --- HTTPDNS 拦截（在误伤放行之后：国内 App 用 HTTPDNS 拿真实 IP 直连，
  #     会绕过域名分流；拦截后 App 回落系统 DNS。个别 App 异常时在此前加 DIRECT 放行）---
  - RULE-SET,httpdns,REJECT

  # --- 局域网 / 私有网络（必须在 QUIC 阻断之前：局域网纯 IP 流量匹配不了
  #     domain 类型的 cn_sites，NOT 取反后 UDP 443 会被误 REJECT）---
  - DST-PORT,7680,REJECT
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - DOMAIN,localhost,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT

  # --- 国内 IP 提前直连（no-resolve：仅命中无域名的纯 IP 流量，
  #     顺带豁免国内 IP 的 QUIC 阻断；域名流量不受影响）---
  - GEOIP,CN,国内直连,no-resolve

  # --- 广告拦截 ---
  - GEOSITE,category-ads-all,广告拦截
  - RULE-SET,anti-ad,广告拦截

  # --- QUIC 阻断（微软/苹果/YouTube/Google 豁免，其余非中国站点 REJECT）---
  - AND,((DST-PORT,443),(NETWORK,UDP),(RULE-SET,microsoft)),微软
  - AND,((DST-PORT,443),(NETWORK,UDP),(RULE-SET,apple)),苹果
  - AND,((DST-PORT,443),(NETWORK,UDP),(GEOSITE,youtube)),YouTube
  - AND,((DST-PORT,443),(NETWORK,UDP),(GEOSITE,google)),Google
  - AND,((DST-PORT,443),(NETWORK,UDP),(NOT,((RULE-SET,cn_sites)))),REJECT

  # --- 前置拦截（规则集 CDN / DoH 域名）---
  - DOMAIN-SUFFIX,jsdelivr.net,节点选择
  - DOMAIN,dns.google,节点选择
  - DOMAIN,dns.google.com,节点选择
  - DOMAIN,dns.cloudflare.com,节点选择

  # --- YouTube ---
  - GEOSITE,youtube,YouTube

  # --- AI（须在 GEOSITE,google 之前：category-ai-!cn 含 gemini/aistudio 等
  #     Google 域名，确保它们归入对地区敏感的 AI 组）---
  - RULE-SET,ai,AI
  # 以下为 category-ai-!cn 未覆盖的补充域名
  - DOMAIN-SUFFIX,stability.ai,AI
  - DOMAIN-SUFFIX,replicate.com,AI
  - DOMAIN-SUFFIX,together.ai,AI
  - DOMAIN-SUFFIX,suno.ai,AI
  - DOMAIN-SUFFIX,suno.com,AI
  - DOMAIN-SUFFIX,runpod.io,AI

  # --- Google 服务（在 AI 之后，避免遮蔽特定 API 子域名；
  #     GEOSITE,google 已含 gstatic.com / googleapis.com 等全部 Google 域名）---
  - GEOSITE,google,Google

