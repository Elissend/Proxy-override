# Mihomo 通用配置模板
# 版本：v4.2 (2026-07-26)
# 架构：3 基础设施组 + 13 业务策略组 + 47 rule-providers + 全加密 DNS
# 适用：Mihomo / Clash.Meta 内核；任何机场订阅
# 对应 JS 覆写脚本：proxy-override.js
#
# ---- 导入方法 ----
#
# 将本文件作为 Mihomo 配置文件加载（或与现有配置合并）。
# 必须将 proxy-providers.sub.url 替换为你的机场订阅链接。
#

# ---- 全局参数 ----

unified-delay: true
tcp-concurrent: true
# 大 idle + 适中 interval：减少移动设备被 keep-alive 探测唤醒的耗电
# （官方 wiki 明确此项影响移动端功耗，OpenClash #2614 有抓包实测；
#   Android 端内核强制禁用 keep-alive 不受影响；死连接最长滞留约 25 分钟）
keep-alive-idle: 600
keep-alive-interval: 60
# 注：global-client-fingerprint 已被新内核移除（v1.19.29+）。如需 uTLS 指纹伪装，
# 在节点上自行添加 client-fingerprint: chrome（JS 覆写版会自动为节点注入）

profile:
  store-selected: true
  # 重启后保留 fake-ip 映射，避免应用 DNS 缓存指向失效地址导致短暂断流
  store-fake-ip: true

# v4.0 全 mrs 化：无 GEOSITE/GEOIP 规则，不再加载 geosite.dat / geoip 数据，
# 内核内存占用显著降低（安卓后台更稳），也无需 geo 数据下载与自动更新

# ---- 端口 / SOCKS / 混合入站 ----

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
# API 鉴权：无 secret 时恶意网页可从浏览器向 127.0.0.1:9090 发请求操控内核。
# ！使用前必须改成你自己的随机字符串，生成方法：
#   Windows PowerShell:  -join ((1..32) | ForEach-Object { '{0:x}' -f (Get-Random -Max 16) })
#   Linux / macOS:       openssl rand -hex 16
# Web 面板（如 metacubexd）连接 127.0.0.1:9090 时填写此密钥
secret: "请修改为你自己的随机字符串"
# 可选：本地面板。取消注释后访问 http://127.0.0.1:9090/ui
# external-ui: ./ui
# external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"

# ---- Sniffer 嗅探 ----

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.netlify.app
    - +.vercel.app
    - +.workers.dev
  skip-domain:
    - +.mijia.cloud
    - +.oray.com
    - +.oray.net
    - +.apple.com

# ---- DNS 全加密 ----

# >>> GENERATED:dns >>> （由 scripts/generate-yaml.js 维护数据行；注释行按下一行内容锚定，重新生成时自动保留）
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.lan
    - +.local
    - +.localhost
    - +.direct
    - +.home.arpa
    - +.internal
    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.baidu.com
    - +.bilibili.com
    - +.bing.com
    - +.chiphell.com
    - +.oray.com
    - +.sunlogin.com
    - +.todesk.com
    - +.rustdesk.com
    - +.teamviewer.com
    - +.anydesk.com
    - +.tailscale.com
    - +.zerotier.com
    - +.nvidia.com
    - +.ntp.org
    - +.pool.ntp.org
    - +.time.apple.com
    - +.time.google.com
    - +.time.nist.gov
    - time.windows.com
    - ip.cip.cc
    - captive.apple.com
    - connectivitycheck.gstatic.com
    - id6.me
    # 微信/QQ 全家桶不走 fake-ip（登录、语音通话对 DNS 结果敏感）
    - +.qq.com
    - +.wechat.com
    - +.weixinbridge.com
    - +.cmpassport.com
    - +.mcdn.bilivideo.cn
    - +.battlenet.com.cn
    - +.wotgame.cn
    - +.wggames.cn
    - +.wowsgame.cn
  default-nameserver:
    - tls://223.5.5.5
    - tls://223.6.6.6
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - tls://223.5.5.5
  direct-nameserver:
    - https://dns.alidns.com/dns-query
  # 注：biliintl（海外站）与 aistudio 已删——它们路由到代理组，
  # fake-ip 模式下本地解析结果不会被使用，属于死条目
  nameserver-policy:
    rule-set:cn_sites,geolocation-cn,bilibili:
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
      - tls://223.5.5.5
      - tls://223.6.6.6
  nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  respect-rules: true
  direct-nameserver-follow-policy: true
# <<< GENERATED:dns <<<

# ---- 代理订阅（proxy-provider） ----
#  替换 sub.url 为你的机场订阅链接
#  如机场订阅本身就是 Clash 兼容格式，type 保持 http
#  如机场提供 SS/SSR/Vmess 链接，需后端转换后使用
#
#  proxy: DIRECT 说明：
#  订阅链接下载走直连，避免"首次启动节点还没下载 → 却需节
#  点去拉订阅"的鸡生蛋死循环。大部分机场订阅域名直连可访问。
#  如果你的机场订阅域名被墙，改为 proxy: 节点选择，但首
#  次启动需要先通过其他方式获取节点（如手动导入一次缓存文件）。
#
#  节点名过滤说明：
#  Mihomo 的 RE2 正则引擎不支持负向零宽断言 (?!...)，
#  无法像 JS 覆写脚本那样在 YAML 中排除"剩余/到期/官网/免费"等
#  信息节点。如果订阅含大量信息节点，建议：
#    1) 使用 proxy-override.js 覆写脚本版本（支持 isInfoNode 过滤）
#    2) 或在机场侧清理无效节点
#    3) 或手动编辑 proxy-providers/sub.yaml 缓存文件删除信息节点行

proxy-providers:
  sub:
    type: http
    url: "https://你的机场订阅链接"
    path: ./proxy-providers/sub.yaml
    # 更新时间，单位为秒，建议设置为 12 小时以上，避免过于频繁地下载订阅
    # 目前为 24 小时（86400 秒），根据需要调整
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300
      lazy: true
      timeout: 5000

# ---- 连接代理（手动添加的独立节点，可选） ----

proxies: []
