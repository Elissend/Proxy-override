# Egern 代理配置
# 版本：v1.0 (2026-05-20)
# 从 ProxyOverride v2.3 (Clash/Mihomo) 迁移而来
# 架构：3 基础设施组 + 9 业务策略组 + 全加密 DNS
# 规则集来源：Centralmatrix3/Matrix-io Egern 原生格式，每日自动更新
#
# === 导入方法 ===
# 1. Egern → 配置 → 导入 → 选择本文件
# 2. 修改 external "机场订阅" 的 urls 为你的机场订阅链接
# 3. 初次使用需等待远程规则集下载（首次冷启动部分规则可能静默跳过）
#
# === 格式说明 ===
# Egern 的 external 策略组期望订阅返回 Egern 原生代理格式
# （如 shadowsocks: / trojan: 等键名）。如机场订阅是 Clash 格式，
# 需联系机场确认是否支持格式切换。
#
# ================================================================

# ================================================================
# 全局参数
# ================================================================

ipv6: false
http_port: 3080
socks_port: 3090
allow_external_connections: false
block_quic: false   # 使用规则级 AND+NOT 精确控制，不用全局一刀切
hide_vpn_icon: false

proxy_latency_test_url: "http://www.gstatic.com/generate_204"

geoip_db_url: "https://rules.xkww3n.cyou/geoip_lite.dat"

# 绕过隧道 / 始终真实 IP 的域名
bypass_tunnel_proxy:
  - "*.local"
  - "192.168.0.0/16"

real_ip_domains:
  - "*.lan"
  - "*.local"
  - "*.localhost"
  - "*.msftconnecttest.com"
  - "*.msftncsi.com"
  - "*.baidu.com"
  - "*.bilibili.com"
  - "*.bing.com"
  - "*.chiphell.com"
  - "*.oray.com"
  - "*.sunlogin.com"
  - "*.todesk.com"
  - "*.rustdesk.com"
  - "*.teamviewer.com"
  - "*.anydesk.com"
  - "*.tailscale.com"
  - "*.zerotier.com"
  - "*.nvidia.com"
  - "*.ntp.org"
  - "*.pool.ntp.org"
  - "*.time.apple.com"
  - "*.time.google.com"
  - "*.time.nist.gov"
  - "time.windows.com"
  - "ip.cip.cc"
  - "captive.apple.com"
  - "connectivitycheck.gstatic.com"
  - "id6.me"
  - "localhost.ptlogin2.qq.com"
  - "*.cmpassport.com"
  - "*.mcdn.bilivideo.cn"
  - "*.battlenet.com.cn"
  - "*.wotgame.cn"
  - "*.wggames.cn"
  - "*.wowsgame.cn"
  - "*.push.apple.com"

# ================================================================
# DNS
# ================================================================
# 真 DNS 模型（非 fake-ip）：
#   Bootstrap 解析 upstream DNS 服务器域名 → 走系统 DNS
#   Forward 规则按序匹配 → 国内域名走阿里 DNS，其余走 Cloudflare
#   不再需要 proxy-server-nameserver（bootstrap 走系统 DNS 无循环依赖）

dns:
  bootstrap:
    - system
    - 223.5.5.5
    - 119.29.29.29

  upstreams:
    alidns:
      - https://dns.alidns.com/dns-query
      - https://223.5.5.5/dns-query
      - https://223.6.6.6/dns-query
    cloudflare:
      - https://1.1.1.1/dns-query
      - https://1.0.0.1/dns-query

  forward:
    # aistudio.google.com 国内 DNS 污染，单独走国外 DNS
    - domain:
        match: "aistudio.google.com"
        value: cloudflare

    - proxy_rule_set:
        match: "https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Egern/Ruleset/ChinaMax.yaml"
        value: alidns
        update_interval: 86400

    - domain_suffix:
        match: "cn"
        value: alidns

    - domain_wildcard:
        match: "*"
        value: cloudflare

  block_ips:
    - 127.0.0.1/32
    - 0.0.0.0/32

  public_ip_lookup_url: "https://ifconfig.me/ip"

# ================================================================
# 策略组
# ================================================================

policy_groups:

  # --- 机场订阅 ---
  - external:
      name: "机场订阅"
      type: select
      urls:
        - "https://你的机场订阅链接"
      update_interval: 86400
      icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Airport.png"

  # --- 基础设施组（3 个） ---

  - select:
      name: "节点选择"
      policies:
        - 自动选择
        - 故障转移
        - 机场订阅
        - DIRECT
      flatten: false
      icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available.png"

  - auto_test:
      name: "自动选择"
      policies:
        - 机场订阅
      flatten: false
      interval: 300
      tolerance: 150
      timeout: 5
      icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png"

  - fallback:
      name: "故障转移"
      policies:
        - 机场订阅
      flatten: false
      interval: 300
      timeout: 5
      icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Round_Robin.png"

  # --- 业务策略组（9 个） ---

  - select:
      name: "AI 服务"
      policies:
        - 节点选择
        - 自动选择
        - 故障转移
        - 机场订阅
        - DIRECT
      flatten: false
      icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Bot.png"

  - select:
      name: "YouTube"
      policies:
        - 节点选择
        - 自动选择
        - 故障转移
        - 机场订阅
        - DIRECT
      flatten: false
      icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png"

  - select:
      name: "Telegram"
      policies:
        - 节点选择
        - 自动选择
        - 故障转移
        - 机场订阅
        - DIRECT
      flatten: false
      icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png"

  - select:
      name: "流媒体"
      policies:
        - 节点选择
        - 自动选择
        - 故障转移
        - 机场订阅
        - DIRECT
      flatten: false
      icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ForeignMedia.png"

  - select:
      name: "苹果服务"
      policies:
        - DIRECT
        - 节点选择
        - 自动选择
        - 故障转移
        - 机场订阅
      flatten: false
      icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Apple.png"

  - select:
      name: "微软服务"
      policies:
        - DIRECT
        - 节点选择
        - 自动选择
        - 故障转移
        - 机场订阅
      flatten: false
      icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Microsoft.png"

  - select:
      name: "国内直连"
      policies:
        - DIRECT
      icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png"

  - select:
      name: "广告拦截"
      policies:
        - REJECT
        - DIRECT
      icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/AdBlack.png"

  - select:
      name: "漏网之鱼"
      policies:
        - 节点选择
        - 自动选择
        - 故障转移
        - 机场订阅
        - DIRECT
        - REJECT
      flatten: false
      icon: "https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Final.png"

# ================================================================
# 规则
# ================================================================
# 顺序 = 优先级，首次命中停止
#
#   1. 微信/APM/推送 → DIRECT（在广告拦截前放行）
#   2. 广告拦截 → Advertising.yaml
#   3. QUIC 阻断（豁免 微软/苹果/YouTube/Google）
#   4. 局域网/私有 → DIRECT
#   5. 前置 → 节点选择
#   6. 业务分流 → 各策略组（YouTube/AI/Telegram/流媒体/Apple/MS/CN）
#   7. 国内直连 → ChinaMax.yaml
#   8. 境外代理 → Global.yaml
#   9. 兜底 → 漏网之鱼

rules:

  # ========== 1. 微信小程序 / APM / 推送（优先放行，防广告规则误伤） ==========
  - domain_suffix: { match: "wxs.qq.com", policy: DIRECT }
  - domain_suffix: { match: "wx.qlogo.cn", policy: DIRECT }
  - domain_suffix: { match: "servicewechat.com", policy: DIRECT }
  - domain_suffix: { match: "mp.weixin.qq.com", policy: DIRECT }
  - domain: { match: "school-wx.qshnhealth.com", policy: DIRECT }
  - domain: { match: "apmplus.volces.com", policy: DIRECT }
  - domain_suffix: { match: "jpush.io", policy: DIRECT }
  - domain_suffix: { match: "jpush.cn", policy: DIRECT }
  - domain: { match: "easytomessage.com", policy: DIRECT }
  # 友盟推送 / 错误日志（国内大量 App 依赖，被广告规则误伤后通知/崩溃上报失效）
  - domain: { match: "msg.umeng.com", policy: DIRECT }
  - domain: { match: "msg.umengcloud.com", policy: DIRECT }
  - domain: { match: "errlog.umeng.com", policy: DIRECT }
  # 归因 SDK（App 安装统计，被拦后冷启动校验失败）
  - domain: { match: "app.adjust.com", policy: DIRECT }
  - domain: { match: "app.appsflyer.com", policy: DIRECT }
  # 公共 CDN（大量网站和小程序前端资源托管于此）
  - domain_suffix: { match: "baomitu.com", policy: DIRECT }
  - domain_suffix: { match: "bootcss.com", policy: DIRECT }
  - domain_suffix: { match: "staticfile.org", policy: DIRECT }
  - domain_suffix: { match: "upaiyun.com", policy: DIRECT }

  # ========== 2. 广告拦截 ==========
  - rule_set:
      match: "https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Egern/Ruleset/Advertising.yaml"
      policy: 广告拦截
      update_interval: 86400

  # ========== 3. QUIC 阻断 ==========
  # 主动 REJECT UDP 443 触发浏览器 TCP 回退。
  # 豁免：微软/苹果/YouTube/Google（QUIC 重度依赖者）
  # 其余非中国站点 QUIC → REJECT
  - and:
      match:
        - dest_port: { match: "443" }
        - protocol: { match: udp }
        - rule_set:
            match: "https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Egern/Ruleset/Microsoft.yaml"
            update_interval: 86400
      policy: 微软服务
  - and:
      match:
        - dest_port: { match: "443" }
        - protocol: { match: udp }
        - domain_suffix: { match: "apple.com" }
      policy: 苹果服务
  - and:
      match:
        - dest_port: { match: "443" }
        - protocol: { match: udp }
        - rule_set:
            match: "https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Egern/Ruleset/YouTube.yaml"
            update_interval: 86400
      policy: YouTube
  - and:
      match:
        - dest_port: { match: "443" }
        - protocol: { match: udp }
        - domain_suffix: { match: "google.com" }
      policy: 节点选择
  - and:
      match:
        - dest_port: { match: "443" }
        - protocol: { match: udp }
        - not:
            match:
              domain_suffix: { match: "cn" }
      policy: REJECT

  # ========== 4. 局域网 / 私有网络 ==========
  - dest_port: { match: "7680", policy: REJECT }
  - rule_set:
      match: "https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Egern/Ruleset/LAN.yaml"
      policy: DIRECT
      update_interval: 86400
  - geoip: { match: PRIVATE, policy: DIRECT, no_resolve: true }
  - domain: { match: "localhost", policy: DIRECT }
  - domain_suffix: { match: "local", policy: DIRECT }

  # ========== 5. 前置拦截（确保规则集和 DNS 下载可用） ==========
  - domain_suffix: { match: "jsdelivr.net", policy: 节点选择 }
  - domain: { match: "dns.google", policy: 节点选择 }
  - domain: { match: "dns.google.com", policy: 节点选择 }

  # ========== 6. YouTube ==========
  - rule_set:
      match: "https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Egern/Ruleset/YouTube.yaml"
      policy: YouTube
      update_interval: 86400

  # ========== 7. AI 服务 ==========
  - rule_set:
      match: "https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Egern/Ruleset/OpenAI.yaml"
      policy: AI 服务
      update_interval: 86400
  - rule_set:
